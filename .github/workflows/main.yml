name: Update Jira Data Review
on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora automáticamente
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Data from Jira
        run: |
          curl -u ${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }} \
          -X GET "https://${{ secrets.JIRA_DOMAIN }}.atlassian.net/rest/api/3/search/jql?jql=project%3DBUCVP%20AND%20statusCategory%20%21%3D%20Done&fields=key,summary,status,assignee,priority,labels,created&maxResults=100" \
          -H "Content-Type: application/json" > data.json

      - name: Commit and Push
        run: |
          git config --global user.name "JiraDataBot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Actualización automática de datos Jira" || exit 0
          git push
