name: Update Jira Data Review
on:
  schedule:
    - cron: '0 11 * * *' # Se ejecuta cada día automáticamente
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Data from Jira
        run: node scripts/fetch-jira.js
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}  

      - name: Commit and Push
        run: |
          git config --global user.name "JiraDataBot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Actualización automática de datos Jira" || exit 0
          git push
