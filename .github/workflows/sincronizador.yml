name: Prueba de Acceso Total
on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Proyectos Disponibles
        run: |
          # Esta consulta pide la lista de proyectos que el Token PUEDE VER
          curl -s -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }}" \
          -X GET "https://tdentel.atlassian.net/rest/api/3/project" \
          -H "Content-Type: application/json" > data.json
      
      - uses: actions/checkout@v4
      - name: Guardar
        run: |
          git config --global user.name "Robot"
          git config --global user.email "robot@github.com"
          git add data.json
          git commit -m "Lista de proyectos" || exit 0
          git push
