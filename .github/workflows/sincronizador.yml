name: Robot de Jira
on:
  workflow_dispatch:

jobs:
  descargar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Probar Conexión Jira
        run: |
          # Intentamos la descarga y guardamos el código de respuesta (ej: 200, 401, 403)
          RESPONSE=$(curl -s -o data.json -w "%{http_code}" -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }}" \
          -X GET "https://tdentel.atlassian.net/rest/api/3/search/jql?jql=project%3DBURC&maxResults=10" \
          -H "Content-Type: application/json")
          
          echo "Código de respuesta Jira: $RESPONSE"
          
          if [ "$RESPONSE" != "200" ]; then
            echo "Error: No se pudo conectar. Revisa el Email y el Token en los Secrets."
            cat data.json # Esto nos mostrará el error que devuelve Jira
            exit 1
          fi

      - name: Guardar en Repo
        run: |
          git config --global user.name "Robot"
          git config --global user.email "robot@github.com"
          git add data.json
          git commit -m "Sincronización exitosa" || exit 0
          git push
