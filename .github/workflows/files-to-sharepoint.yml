name: Publicar varios archivos en SharePoint
on:
  schedule:
    - cron: '0 3 * * 1' # Se ejecuta cada lunes automáticamente
  
  push:
    branches:
      - main # Se ejecuta al hacer push a main
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Enviar archivos a SharePoint
        env:
          WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_SECRET_TOKEN }}
        run: |
          ARCHIVOS=(
            "index.html"
            "styles.css"
            "scripts.js"            
          )

          for FILE_PATH in "${ARCHIVOS[@]}"; do
            if [ -f "$FILE_PATH" ]; then
              FILE_NAME=$(basename "$FILE_PATH")
              echo "Procesando y enviando: $FILE_NAME ..."

              # 1. Codificar archivo en Base64
              BASE64_CONTENT=$(base64 -w 0 "$FILE_PATH")

              # 2. Armar JSON con jq
              PAYLOAD=$(jq -n \
                --arg fn "$FILE_NAME" \
                --arg fc "$BASE64_CONTENT" \
                --arg st "$WEBHOOK_TOKEN" \
                '{fileName: $fn, fileContentBase64: $fc, secretToken: $st}')

              # 3. Enviar al webhook
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")

              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
                echo "❌ Error enviando $FILE_NAME (Código HTTP: $HTTP_STATUS)"
                exit 1
              else
                echo "✅ $FILE_NAME enviado con éxito."
              fi
            else
              echo "⚠️ El archivo $FILE_PATH no existe en la raíz, omitiendo..."
            fi
          done
