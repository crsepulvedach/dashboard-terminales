name: Publicar varios archivos en SharePoint

on:
  push:
    branches:
      - main       # Se ejecuta al hacer push a main
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # --- [AQUÍ VA TU PROCESO DE GENERACIÓN DEL ARCHIVO] ---
      # Por ejemplo, si ejecutas un script de Python, R o Node que genera un reporte:
      # - name: Generar reporte
      #   run: python generar_reporte.py
      #
      # Para esta plantilla creamos un archivo de ejemplo:
      - name: Enviar listado de archivos a SharePoint
        env:
          WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_SECRET_TOKEN }}
        run: |
          # 1. Define aquí tu listado de archivos separados por espacio
          ARCHIVOS=(
            "index.html"
            "styles.css"
            "scripts.js"
          )

          # 2. Recorrer cada archivo del listado
          for FILE_PATH in "${ARCHIVOS[@]}"; do
            if [ -f "$FILE_PATH" ]; then
              FILE_NAME=$(basename "$FILE_PATH")
              echo "Procesando y enviando: $FILE_NAME ..."

              # Codificar a base64
              BASE64_CONTENT=$(base64 -w 0 "$FILE_PATH")

              # Enviar al webhook
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d @- <<EOF
              {
                "fileName": "$FILE_NAME",
                "fileContentBase64": "$BASE64_CONTENT",
                "secretToken": "$WEBHOOK_TOKEN"
              }
              EOF
              )

              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
                echo "❌ Error enviando $FILE_NAME (Código HTTP $HTTP_STATUS)"
                exit 1
              else
                echo "✅ $FILE_NAME enviado con éxito."
              fi
            else
              echo "⚠️ El archivo $FILE_PATH no existe, omitiendo..."
            fi
          done
